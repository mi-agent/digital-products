name: daily-income-radar
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh signals
        run: python scripts/daily_update.py
      - name: Commit if changed
        run: |
          git config user.name "income-radar-bot"
          git config user.email "bot@local.dev"
          git add OPPORTUNITIES.md
          if git diff --staged --quiet; then echo "no change"; else git commit -m "chore: daily income radar" && git push; fi
